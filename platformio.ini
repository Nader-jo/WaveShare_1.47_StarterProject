; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = waveshare_esp32_s3_1_47

[common]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
lib_deps = 
    lvgl
    PNGdec

[env:waveshare_esp32_s3_1_47]
extends = common
build_flags = 
    -D BOARD_TYPE_WAVESHARE_ESP32_S3_1_47

[env:waveshare_esp32_s3_1_47B]
extends = common
build_flags = 
    -D BOARD_TYPE_WAVESHARE_ESP32_S3_1_47B
lib_deps = 
    OneButton

[env:waveshare_esp32_c6_1_47]
extends = common
build_flags = 
    -D BOARD_TYPE_WAVESHARE_ESP32_C6_1_47

